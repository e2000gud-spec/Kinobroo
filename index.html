<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Киноброуски</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e0e12;
      --card: #18181f;
      --card-2: #22222c;
      --border: #2c2c38;
      --text: #f3f3f7;
      --muted: #8e8ea0;
      --accent: #f5b400;
      --accent-dim: rgba(245, 180, 0, 0.14);
      --green: #22c55e;
      --blue: #3b82f6;
      --purple: #a855f7;
      --red: #ef4444;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .wrap {
      max-width: 720px; margin: 0 auto;
      padding: 12px 12px 96px;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; margin-bottom: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 6px;
      font-weight: 800; font-size: 16px; letter-spacing: -0.3px;
      min-width: 0;
    }
    .brand-txt {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cloud-pill {
      font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 999px;
      background: rgba(59, 130, 246, 0.16); color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      flex-shrink: 0;
    }
    .top-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-size: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; padding: 0;
    }
    .icon-btn .dot {
      position: absolute; top: 4px; right: 4px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
    }
    .add-btn {
      height: 32px; padding: 0 10px; border-radius: 10px;
      background: var(--accent); color: #111; border: none;
      font-weight: 800; font-size: 12.5px;
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer; white-space: nowrap;
    }
    .stats {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 5px; margin-bottom: 10px;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 7px 3px; text-align: center;
      cursor: pointer;
    }
    .stat.active { border-color: var(--accent); background: var(--accent-dim); }
    .stat .lbl { font-size: 9.5px; color: var(--muted); display: block; margin-bottom: 2px; }
    .stat .val { font-size: 14px; font-weight: 800; }
    .tabs {
      display: flex; gap: 6px; overflow-x: auto;
      padding-bottom: 4px; margin-bottom: 10px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto; padding: 7px 11px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: 12.5px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 5px;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent-dim); border-color: var(--accent); color: var(--text);
    }
    .tab .cnt {
      background: var(--card-2); color: var(--muted);
      padding: 1px 6px; border-radius: 999px; font-size: 10.5px;
    }
    .tab.active .cnt { background: var(--accent); color: #111; }
    .search-row { margin-bottom: 10px; position: relative; }
    .search-input {
      width: 100%; height: 40px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 0 36px 0 13px; font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .clear-search {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer;
      display: none;
    }
    .filters {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .pill {
      padding: 5px 9px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .pill.active { background: #fff; color: #111; border-color: #fff; }
    .sort-sel {
      height: 28px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-size: 11.5px; padding: 0 8px; outline: none;
    }
    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }
    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .poster-box {
      position: relative; aspect-ratio: 2 / 3;
      background: linear-gradient(145deg, #1d1d26, #14141b);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .poster-box img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .poster-fallback {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 12px; text-align: center;
      color: var(--muted); gap: 6px;
    }
    .poster-fallback .big-ic { font-size: 30px; opacity: 0.7; }
    .poster-fallback .fb-title {
      font-size: 12px; font-weight: 700; color: #c4c4d4;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .badge-status {
      position: absolute; top: 7px; left: 7px;
      padding: 3px 7px; border-radius: 999px;
      font-size: 10.5px; font-weight: 700;
      backdrop-filter: blur(6px);
    }
    .st-watched { background: rgba(34, 197, 94, 0.92); color: #052e16; }
    .st-watching { background: rgba(59, 130, 246, 0.92); color: #fff; }
    .st-planned { background: rgba(24, 24, 31, 0.88); color: #e4e4ec; border: 1px solid rgba(255,255,255,0.14); }
    .st-waiting { background: rgba(239, 68, 68, 0.92); color: #fff; }
    .badge-rate {
      position: absolute; top: 7px; right: 7px;
      background: rgba(14, 14, 18, 0.9); color: var(--accent);
      border: 1px solid rgba(245, 180, 0, 0.45);
      padding: 2px 6px; border-radius: 999px;
      font-size: 10.5px; font-weight: 800;
    }
    .badge-type {
      position: absolute; bottom: 7px; left: 7px;
      background: rgba(14, 14, 18, 0.86); color: var(--text);
      padding: 2px 6px; border-radius: 7px; font-size: 10px; font-weight: 600;
    }
    .card-tools {
      position: absolute; bottom: 7px; right: 7px;
      display: flex; gap: 4px;
    }
    .mini-ic {
      width: 25px; height: 25px; border-radius: 7px;
      background: rgba(14, 14, 18, 0.88); border: 1px solid rgba(255,255,255,0.14);
      color: var(--text); font-size: 11px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
    }
    .card-body {
      padding: 9px; display: flex; flex-direction: column;
      justify-content: space-between; flex: 1; gap: 7px;
    }
    .card-title {
      font-size: 13px; font-weight: 700; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta {
      font-size: 11px; color: var(--muted); margin-top: 3px;
    }
    .prog-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card-2); border-radius: 8px; padding: 4px 7px;
      font-size: 11px; font-weight: 600;
    }
    .prog-btns { display: flex; gap: 4px; }
    .p-btn {
      width: 21px; height: 21px; border-radius: 6px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-weight: 700; cursor: pointer; padding: 0;
    }
    .card-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
    }
    .act-btn {
      height: 29px; border-radius: 8px;
      background: var(--card-2); border: 1px solid var(--border);
      color: var(--text); font-size: 11px; font-weight: 600;
      cursor: pointer; padding: 0 4px;
    }
    .act-btn.gold {
      background: var(--accent-dim); border-color: rgba(245, 180, 0, 0.35);
      color: var(--accent);
    }
    .empty {
      grid-column: 1 / -1; text-align: center;
      padding: 40px 16px; color: var(--muted);
      background: var(--card); border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 100; backdrop-filter: blur(4px);
    }
    .modal-bg.open { display: flex; }
    @media (min-width: 560px) { .modal-bg { align-items: center; padding: 16px; } }
    .modal {
      width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
      background: #16161d; border: 1px solid var(--border);
      border-radius: 22px 22px 0 0; padding: 16px;
    }
    @media (min-width: 560px) { .modal { border-radius: 22px; } }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 16px; font-weight: 800; }
    .close-x {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--card-2); border: none; color: var(--text);
      font-size: 15px; cursor: pointer;
    }
    .type-switch {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px;
    }
    .t-opt {
      padding: 8px 6px; border-radius: 12px; text-align: center;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .t-opt.active { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
    .field-lbl {
      display: block; font-size: 10.5px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px;
      margin: 10px 0 6px;
    }
    .input-row { display: flex; gap: 6px; }
    .inp {
      flex: 1; height: 40px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 0 12px; font-size: 14px; outline: none;
    }
    .inp:focus { border-color: var(--accent); }
    .find-btn {
      height: 40px; padding: 0 12px; border-radius: 12px;
      background: var(--card-2); border: 1px solid var(--border);
      color: var(--text); font-weight: 700; font-size: 12.5px; cursor: pointer;
      white-space: nowrap;
    }
    .search-results {
      margin-top: 8px; display: flex; flex-direction: column; gap: 6px;
      max-height: 220px; overflow-y: auto;
    }
    .sr-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 7px 9px;
    }
    .sr-thumb {
      width: 34px; height: 48px; border-radius: 6px;
      background: var(--card-2); object-fit: cover; flex-shrink: 0;
    }
    .sr-info { flex: 1; min-width: 0; }
    .sr-name {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sr-sub { font-size: 11px; color: var(--muted); }
    .sr-pick {
      padding: 6px 10px; border-radius: 9px;
      background: var(--card-2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .sr-msg {
      text-align: center; font-size: 12px; color: var(--muted);
      padding: 12px; background: var(--card); border-radius: 12px;
      border: 1px solid var(--border);
    }
    .poster-preview-box {
      display: flex; gap: 10px; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px; margin-top: 10px;
    }
    .prev-img {
      width: 52px; height: 76px; border-radius: 9px;
      background: var(--card-2); object-fit: cover; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 11px; text-align: center;
    }
    .status-pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .st-opt {
      padding: 5px 9px; border-radius: 8px;
      background: var(--card-2); border: 1px solid var(--border);
      color: var(--muted); font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .st-opt.active { background: #fff; color: #111; border-color: #fff; }
    .se-box {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px; margin-top: 10px;
    }
    .se-ctrl {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card-2); border-radius: 9px; padding: 4px 8px; margin-top: 4px;
    }
    .rate-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
    }
    .r-opt {
      height: 34px; border-radius: 9px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .r-opt.active { background: var(--accent); color: #111; border-color: var(--accent); }
    .modal-foot {
      display: flex; gap: 8px; margin-top: 16px;
    }
    .btn-sec {
      flex: 1; height: 42px; border-radius: 12px;
      background: var(--card-2); border: 1px solid var(--border);
      color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .btn-pri {
      flex: 1.4; height: 42px; border-radius: 12px;
      background: var(--accent); border: none;
      color: #111; font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #22222c; color: #fff; border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="brand-txt">🎬 Киноброуски</span>
        <span class="cloud-pill">TG Cloud</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnSettings" title="Настройки API Кинопоиска">⚙️<span class="dot" id="kpDot" style="display:none"></span></button>
        <button class="icon-btn" id="btnExport" title="Экспорт JSON">⬇️</button>
        <button class="icon-btn" id="btnImport" title="Импорт JSON">⬆️</button>
        <input type="file" id="importFile" accept=".json" style="display:none" />
        <button class="add-btn" id="btnOpenAdd">+ Добавить</button>
      </div>
    </div>

    <div class="stats" id="statsBar"></div>
    <div class="tabs" id="typeTabs"></div>

    <div class="search-row">
      <input type="text" class="search-input" id="localSearch" placeholder="Поиск по сохранённым тайтлам..." />
      <button class="clear-search" id="clearLocalSearch">✕</button>
    </div>

    <div class="filters">
      <div class="pills" id="statusPills"></div>
      <select class="sort-sel" id="sortSel">
        <option value="newest">Сначала новые</option>
        <option value="rating">По оценке</option>
        <option value="alpha">По алфавиту</option>
      </select>
    </div>

    <div class="grid" id="cardsGrid"></div>
  </div>

  <div class="modal-bg" id="editModal">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalHeading">Добавить тайтл</div>
        <button class="close-x" id="closeEditModal">✕</button>
      </div>

      <div class="type-switch" id="modalTypeSwitch">
        <div class="t-opt active" data-type="movie">🎬 Фильм</div>
        <div class="t-opt" data-type="series">📺 Сериал</div>
        <div class="t-opt" data-type="anime">⛩️ Аниме</div>
      </div>

      <label class="field-lbl">Название по-русски или на английском</label>
      <div class="input-row">
        <input type="text" class="inp" id="fTitle" placeholder="Например: Матрица или Атака титанов" />
        <button class="find-btn" id="btnSearchApi">🔍 Постер</button>
      </div>
      <div class="search-results" id="apiResults"></div>

      <div class="poster-preview-box">
        <div class="prev-img" id="posterPreview">Нет фото</div>
        <div style="flex:1;min-width:0">
          <label class="field-lbl" style="margin-top:0">Ссылка на обложку</label>
          <input type="text" class="inp" id="fPoster" placeholder="https://..." style="width:100%;height:36px;font-size:12.5px" />
          <div class="status-pills" id="modalStatusPills">
            <div class="st-opt active" data-st="watched">Просмотрено</div>
            <div class="st-opt" data-st="watching">Смотрю</div>
            <div class="st-opt" data-st="planned">В планах</div>
            <div class="st-opt" data-st="waiting">Ожидание</div>
          </div>
        </div>
      </div>

      <div class="se-box" id="seBlock" style="display:none">
        <div>
          <span style="font-size:11px;color:var(--muted);font-weight:700">Сезон</span>
          <div class="se-ctrl">
            <button class="p-btn" type="button" id="decSeason">-</button>
            <span id="seasonVal">1</span>
            <button class="p-btn" type="button" id="incSeason">+</button>
          </div>
        </div>
        <div>
          <span style="font-size:11px;color:var(--muted);font-weight:700">Серия</span>
          <div class="se-ctrl">
            <button class="p-btn" type="button" id="decEp">-</button>
            <span id="epVal">1</span>
            <button class="p-btn" type="button" id="incEp">+</button>
          </div>
        </div>
      </div>

      <label class="field-lbl">Оценка (1–10)</label>
      <div class="rate-grid" id="rateGrid"></div>

      <label class="field-lbl">Заметка (необязательно)</label>
      <input type="text" class="inp" id="fNote" placeholder="Короткий коммент для себя..." style="width:100%" />

      <div class="modal-foot">
        <button class="btn-sec" id="cancelEditBtn">Отмена</button>
        <button class="btn-pri" id="saveItemBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="settingsModal">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">⚙️ Настройки поиска (Кинопоиск)</div>
        <button class="close-x" id="closeSettingsModal">✕</button>
      </div>
      <p style="font-size:13px;color:var(--muted);line-height:1.45;margin-top:0">
        Вставь свой бесплатный <b>X-API-KEY</b> с <code style="color:var(--accent)">kinopoiskapiunofficial.tech</code> — ключ бессрочный (500 запросов/сутки) и сохранится в облаке Telegram.
      </p>
      <label class="field-lbl">API-ключ Кинопоиска</label>
      <input type="text" class="inp" id="kpKeyInput" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" style="width:100%" />
      <div class="modal-foot">
        <button class="btn-sec" id="clearKpKeyBtn">Очистить</button>
        <button class="btn-pri" id="saveKpKeyBtn">Сохранить ключ</button>
      </div>
    </div>
  </div>

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function cloudGetRaw(key) {
  return new Promise((resolve) => {
    let localVal = '';
    try { localVal = localStorage.getItem(key) || ''; } catch (e) {}
    if (tg && tg.CloudStorage) {
      try {
        tg.CloudStorage.getItem(key, (err, val) => {
          if (!err && val) return resolve(val);
          resolve(localVal);
        });
      } catch (e) {
        resolve(localVal);
      }
    } else {
      resolve(localVal);
    }
  });
}

async function readKeySmart(baseKey) {
  const chunkCntStr = await cloudGetRaw(baseKey + '_chunks');
  const chunkCnt = parseInt(chunkCntStr, 10);
  if (chunkCnt > 0 && chunkCnt < 50) {
    const parts = [];
    for (let i = 0; i < chunkCnt; i++) {
      parts.push(await cloudGetRaw(baseKey + '_' + i));
    }
    const joined = parts.join('');
    if (joined) return joined;
  }
  return await cloudGetRaw(baseKey);
}

function cloudSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) {}
  if (tg && tg.CloudStorage) {
    try {
      if (val.length <= 3800) {
        tg.CloudStorage.setItem(key, val);
        tg.CloudStorage.setItem(key + '_chunks', '0');
      } else {
        const chunks = Math.ceil(val.length / 3800);
        tg.CloudStorage.setItem(key + '_chunks', String(chunks));
        for (let i = 0; i < chunks; i++) {
          tg.CloudStorage.setItem(key + '_' + i, val.slice(i * 3800, (i + 1) * 3800));
        }
      }
    } catch (e) {}
  }
}

        const norm = String(s.title).toLowerCase().trim();
        // Allow same name if different type (e.g. Джентельмены movie vs series)
        const typeKey = (s.type || 'movie') + '::' + norm;
        if (!seen.has(norm) && !seen.has(typeKey)) {
          seen.add(typeKey);
          merged.push(s);
        }
      }
      items = merged;
      try { localStorage.setItem(SEED_FLAG_KEY, '1'); } catch (e) {}
      saveItems();
    } else {
      items = existingItems;
    }
  } catch (err) {
    items = INITIAL_SEED.slice();
  }
  render();
}

function saveItems() {
  const str = JSON.stringify(items);
  cloudSet(STORAGE_KEY_WRITE, str);
}

function updateKpIndicator() {
  const dot = document.getElementById('kpDot');
  if (dot) dot.style.display = kpApiKey ? 'block' : 'none';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function render() {
  const total = items.length;
  const cWatching = items.filter(x => x.status === 'watching').length;
  const cWatched = items.filter(x => x.status === 'watched').length;
  const cPlanned = items.filter(x => x.status === 'planned').length;
  const cWaiting = items.filter(x => x.status === 'waiting').length;

  document.getElementById('statsBar').innerHTML =
    `<div class="stat ${filterStatus==='all'?'active':''}" onclick="setStatusFilter('all')"><span class="lbl">Всего</span><span class="val">${total}</span></div>` +
    `<div class="stat ${filterStatus==='watching'?'active':''}" onclick="setStatusFilter('watching')"><span class="lbl">Смотрю</span><span class="val" style="color:var(--blue)">${cWatching}</span></div>` +
    `<div class="stat ${filterStatus==='watched'?'active':''}" onclick="setStatusFilter('watched')"><span class="lbl">Просмот.</span><span class="val" style="color:var(--green)">${cWatched}</span></div>` +
    `<div class="stat ${filterStatus==='planned'?'active':''}" onclick="setStatusFilter('planned')"><span class="lbl">В планах</span><span class="val">${cPlanned}</span></div>` +
    `<div class="stat ${filterStatus==='waiting'?'active':''}" onclick="setStatusFilter('waiting')"><span class="lbl">Ожидание</span><span class="val" style="color:var(--red)">${cWaiting}</span></div>`;

  const cMovies = items.filter(x => x.type === 'movie').length;
  const cSeries = items.filter(x => x.type === 'series').length;
  const cAnime = items.filter(x => x.type === 'anime').length;

  document.getElementById('typeTabs').innerHTML =
    `<div class="tab ${filterType==='all'?'active':''}" onclick="setTypeFilter('all')">🔥 Все <span class="cnt">${total}</span></div>` +
    `<div class="tab ${filterType==='movie'?'active':''}" onclick="setTypeFilter('movie')">🎬 Фильмы <span class="cnt">${cMovies}</span></div>` +
    `<div class="tab ${filterType==='series'?'active':''}" onclick="setTypeFilter('series')">📺 Сериалы <span class="cnt">${cSeries}</span></div>` +
    `<div class="tab ${filterType==='anime'?'active':''}" onclick="setTypeFilter('anime')">⛩️ Аниме <span class="cnt">${cAnime}</span></div>`;

  const pillsData = [
    ['all', 'Все'],
    ['watching', 'Смотрю'],
    ['watched', 'Просмотрено'],
    ['planned', 'В планах'],
    ['waiting', 'Ожидание']
  ];
  document.getElementById('statusPills').innerHTML = pillsData.map(function(pair) {
    return `<div class="pill ${filterStatus===pair[0]?'active':''}" onclick="setStatusFilter('${pair[0]}')">${pair[1]}</div>`;
  }).join('');

  let list = items.filter(function(x) {
    if (filterType !== 'all' && x.type !== filterType) return false;
    if (filterStatus !== 'all' && x.status !== filterStatus) return false;
    if (localQuery && !(x.title || '').toLowerCase().includes(localQuery.toLowerCase())) return false;
    return true;
  });

  if (sortBy === 'rating') {
    list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else if (sortBy === 'alpha') {
    list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ru'));
  } else {
    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }

  const grid = document.getElementById('cardsGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty">Ничего не найдено по текущим фильтрам</div>`;
    return;
  }

  const stMap = {
    watched: ['Просмотрено', 'st-watched'],
    watching: ['Смотрю', 'st-watching'],
    planned: ['В планах', 'st-planned'],
    waiting: ['Ожидание', 'st-waiting']
  };
  const typeMap = {
    movie: '🎬 Фильм',
    series: '📺 Сериал',
    anime: '⛩️ Аниме'
  };

  grid.innerHTML = list.map(function(item) {
    const stPair = stMap[item.status] || stMap.planned;
    const typeText = typeMap[item.type] || '🎬 Фильм';
    const showSE = item.type !== 'movie';
    const fallbackIcon = item.type === 'anime' ? '⛩️' : (item.type === 'series' ? '📺' : '🎬');
    const posterHtml = item.poster
      ? `<img src="${escapeHtml(item.poster)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />` +
        `<div class="poster-fallback" style="display:none"><span class="big-ic">${fallbackIcon}</span><span class="fb-title">${escapeHtml(item.title)}</span></div>`
      : `<div class="poster-fallback"><span class="big-ic">${fallbackIcon}</span><span class="fb-title">${escapeHtml(item.title)}</span></div>`;

    const metaText = item.note
      ? escapeHtml(item.note)
      : (showSE && item.status === 'watching' ? `Сезон ${item.season} • Серия ${item.episode}` : 'Без заметки');

    const progHtml = (showSE && item.status === 'watching')
      ? `<div class="prog-bar"><span>С${item.season} : Э${item.episode}</span><div class="prog-btns"><button class="p-btn" onclick="stepEpisode('${item.id}', -1)">-</button><button class="p-btn" onclick="stepEpisode('${item.id}', 1)">+</button></div></div>`
      : '';

    return `<div class="card">` +
      `<div class="poster-box">` +
        posterHtml +
        `<span class="badge-status ${stPair[1]}">${stPair[0]}</span>` +
        (item.rating ? `<span class="badge-rate">★ ${item.rating}</span>` : '') +
        `<span class="badge-type">${typeText}</span>` +
        `<div class="card-tools">` +
          `<button class="mini-ic" onclick="openEditModal('${item.id}')" title="Изменить">✏️</button>` +
          `<button class="mini-ic" onclick="deleteItem('${item.id}')" title="Удалить">🗑️</button>` +
        `</div>` +
      `</div>` +
      `<div class="card-body">` +
        `<div>` +
          `<div class="card-title">${escapeHtml(item.title)}</div>` +
          `<div class="card-meta">${metaText}</div>` +
        `</div>` +
        progHtml +
        `<div class="card-actions">` +
          `<button class="act-btn" onclick="cycleStatus('${item.id}')">🔄 Статус</button>` +
          `<button class="act-btn gold" onclick="openEditModal('${item.id}')">★ Оценить</button>` +
        `</div>` +
      `</div>` +
    `</div>`;
  }).join('');
}

window.setTypeFilter = function(t) { filterType = t; render(); };
window.setStatusFilter = function(s) { filterStatus = s; render(); };

window.stepEpisode = function(id, delta) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  it.episode = Math.max(1, (it.episode || 1) + delta);
  saveItems(); render();
};

window.cycleStatus = function(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  const order = ['planned', 'watching', 'watched', 'waiting'];
  it.status = order[(order.indexOf(it.status) + 1) % order.length];
  saveItems(); render();
  showToast('Статус обновлён');
};

window.deleteItem = function(id) {
  items = items.filter(x => x.id !== id);
  saveItems(); render();
  showToast('Удалено');
};

async function searchMediaApi() {
  const q = document.getElementById('fTitle').value.trim();
  const box = document.getElementById('apiResults');
  if (!q) {
    box.innerHTML = `<div class="sr-msg">Введи название для поиска</div>`;
    return;
  }
  box.innerHTML = `<div class="sr-msg">Ищу в базе...</div>`;

  const results = [];

  if (kpApiKey) {
    try {
      const res = await fetch('https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=' + encodeURIComponent(q) + '&page=1', {
        headers: { 'X-API-KEY': kpApiKey, 'Content-Type': 'application/json' }
      });
      if (res.ok) {
        const data = await res.json();
        (data.films || []).slice(0, 8).forEach(function(f) {
          const title = f.nameRu || f.nameEn || q;
          const sub = [f.year, (f.nameEn && f.nameRu) ? f.nameEn : '', 'Кинопоиск'].filter(Boolean).join(' • ');
          results.push({
            title: title,
            sub: sub,
            poster: f.posterUrlPreview || f.posterUrl || ''
          });
        });
      }
    } catch (e) {}
  }

  if (!results.length) {
    const tasks = [];

    if (formType === 'anime') {
      tasks.push((async function() {
        try {
          const r = await fetch('https://shikimori.one/api/animes?search=' + encodeURIComponent(q) + '&limit=6');
          if (r.ok) {
            const arr = await r.json();
            arr.forEach(function(a) {
              const img = (a.image && a.image.original) ? ('https://shikimori.one' + a.image.original) : '';
              results.push({
                title: a.russian || a.name,
                sub: [a.aired_on ? a.aired_on.slice(0, 4) : '', 'Shikimori'].filter(Boolean).join(' • '),
                poster: img
              });
            });
          }
        } catch (e) {}
      })());
    }

    if (formType === 'series' || formType === 'anime') {
      tasks.push((async function() {
        try {
          const r = await fetch('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(q));
          if (r.ok) {
            const arr = await r.json();
            arr.slice(0, 4).forEach(function(s) {
              const sh = s.show || {};
              results.push({
                title: sh.name,
                sub: [sh.premiered ? sh.premiered.slice(0, 4) : '', 'TVMaze'].filter(Boolean).join(' • '),
                poster: sh.image ? (sh.image.medium || sh.image.original || '') : ''
              });
            });
          }
        } catch (e) {}
      })());
    }

    tasks.push((async function() {
      try {
        const suffix = formType === 'anime' ? 'аниме' : (formType === 'series' ? 'телесериал' : 'фильм');
        const wikiQuery = q + ' ' + suffix;
        const url = 'https://ru.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' +
          encodeURIComponent(wikiQuery) +
          '&gsrlimit=6&prop=pageimages|extracts&exintro=1&explaintext=1&exsentences=1&piprop=thumbnail&pithumbsize=400&format=json&origin=*';
        const r = await fetch(url);
        if (r.ok) {
          const data = await r.json();
          const pages = (data.query && data.query.pages) ? Object.values(data.query.pages) : [];
          const mediaRx = new RegExp('(фильм|сериал|мультфильм|аниме|манга|дунхуа|картина|комедия|триллер|боевик|драма)', 'i');
          const yearRx = new RegExp('\\b(19\\d\\d|20\\d\\d)\\b');
          const parenRx = new RegExp('\\s*\\((?:фильм|телесериал|аниме|мультфильм)[^)]*\\)', 'i');
          pages.forEach(function(p) {
            const desc = (p.extract || '') + ' ' + (p.title || '');
            if (!mediaRx.test(desc)) return;
            const cleanT = (p.title || '').replace(parenRx, '').trim();
            const yrMatch = (p.extract || '').match(yearRx);
            results.push({
              title: cleanT,
              sub: [yrMatch ? yrMatch[1] : '', 'Википедия'].filter(Boolean).join(' • '),
              poster: p.thumbnail ? p.thumbnail.source : ''
            });
          });
        }
      } catch (e) {}
    })());

    await Promise.all(tasks);
  }

  if (!results.length) {
    const hint = !kpApiKey ? ' (либо добавь ключ Кинопоиска в ⚙️)' : '';
    box.innerHTML = `<div class="sr-msg">Ничего не нашлось — проверь написание или вставь ссылку вручную${hint}</div>`;
    return;
  }

  window._lastApiResults = results;
  box.innerHTML = results.slice(0, 8).map(function(r, i) {
    const thumb = r.poster
      ? `<img class="sr-thumb" src="${escapeHtml(r.poster)}" alt="" />`
      : `<div class="sr-thumb" style="display:flex;align-items:center;justify-content:center;font-size:16px">🎬</div>`;
    return `<div class="sr-item">` +
      thumb +
      `<div class="sr-info"><div class="sr-name">${escapeHtml(r.title)}</div><div class="sr-sub">${escapeHtml(r.sub)}</div></div>` +
      `<button class="sr-pick" type="button" onclick="pickApiResult(${i})">Выбрать</button>` +
    `</div>`;
  }).join('');
}

window.pickApiResult = function(idx) {
  const r = (window._lastApiResults || [])[idx];
  if (!r) return;
  document.getElementById('fTitle').value = r.title;
  document.getElementById('fPoster').value = r.poster || '';
  updatePosterPreview();
  document.getElementById('apiResults').innerHTML = '';
};

function updatePosterPreview() {
  const url = document.getElementById('fPoster').value.trim();
  const box = document.getElementById('posterPreview');
  if (url) {
    box.innerHTML = `<img src="${escapeHtml(url)}" style="width:100%;height:100%;object-fit:cover;border-radius:9px" onerror="this.parentElement.textContent='Ошибка фото'" />`;
  } else {
    box.textContent = 'Нет фото';
  }
}

function renderModalControls() {
  document.querySelectorAll('#modalTypeSwitch .t-opt').forEach(function(el) {
    el.classList.toggle('active', el.dataset.type === formType);
  });
  document.querySelectorAll('#modalStatusPills .st-opt').forEach(function(el) {
    el.classList.toggle('active', el.dataset.st === formStatus);
  });
  document.getElementById('seBlock').style.display = formType !== 'movie' ? 'grid' : 'none';
  document.getElementById('seasonVal').textContent = formSeason;
  document.getElementById('epVal').textContent = formEpisode;

  const rates = [null, 1, 2, 3, 4, 5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];
  document.getElementById('rateGrid').innerHTML = rates.map(function(r) {
    const arg = (r === null) ? 'null' : r;
    const lbl = (r === null) ? 'Без' : r;
    return `<button type="button" class="r-opt ${formRating === r ? 'active' : ''}" onclick="setFormRating(${arg})">${lbl}</button>`;
  }).join('');
}

window.setFormRating = function(r) {
  formRating = r;
  if (r !== null && formStatus === 'planned') formStatus = 'watched';
  renderModalControls();
};

function openAddModal() {
  editingId = null;
  formType = filterType !== 'all' ? filterType : 'movie';
  formStatus = 'watched';
  formRating = null;
  formSeason = 1;
  formEpisode = 1;
  document.getElementById('modalHeading').textContent = 'Добавить тайтл';
  document.getElementById('fTitle').value = '';
  document.getElementById('fPoster').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('apiResults').innerHTML = '';
  updatePosterPreview();
  renderModalControls();
  document.getElementById('editModal').classList.add('open');
}

window.openEditModal = function(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  editingId = id;
  formType = it.type || 'movie';
  formStatus = it.status || 'watched';
  formRating = (it.rating !== undefined) ? it.rating : null;
  formSeason = it.season || 1;
  formEpisode = it.episode || 1;
  document.getElementById('modalHeading').textContent = 'Редактировать';
  document.getElementById('fTitle').value = it.title || '';
  document.getElementById('fPoster').value = it.poster || '';
  document.getElementById('fNote').value = it.note || '';
  document.getElementById('apiResults').innerHTML = '';
  updatePosterPreview();
  renderModalControls();
  document.getElementById('editModal').classList.add('open');
};

function saveModalItem() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) {
    showToast('Введи название!');
    return;
  }
  const poster = document.getElementById('fPoster').value.trim();
  const note = document.getElementById('fNote').value.trim();

  if (editingId) {
    const it = items.find(x => x.id === editingId);
    if (it) {
      it.type = formType;
      it.title = title;
      it.poster = poster;
      it.status = formStatus;
      it.rating = formRating;
      it.season = formSeason;
      it.episode = formEpisode;
      it.note = note;
    }
    showToast('Сохранено');
  } else {
    items.unshift({
      id: 'item_' + Date.now(),
      type: formType,
      title: title,
      poster: poster,
      status: formStatus,
      rating: formRating,
      season: formSeason,
      episode: formEpisode,
      note: note,
      createdAt: Date.now()
    });
    showToast('Добавлено в список');
  }
  saveItems();
  document.getElementById('editModal').classList.remove('open');
  render();
}

document.getElementById('btnOpenAdd').onclick = openAddModal;
document.getElementById('closeEditModal').onclick = () => document.getElementById('editModal').classList.remove('open');
document.getElementById('cancelEditBtn').onclick = () => document.getElementById('editModal').classList.remove('open');
document.getElementById('saveItemBtn').onclick = saveModalItem;
document.getElementById('btnSearchApi').onclick = searchMediaApi;
document.getElementById('fPoster').oninput = updatePosterPreview;

document.querySelectorAll('#modalTypeSwitch .t-opt').forEach(function(el) {
  el.onclick = function() { formType = el.dataset.type; renderModalControls(); };
});
document.querySelectorAll('#modalStatusPills .st-opt').forEach(function(el) {
  el.onclick = function() { formStatus = el.dataset.st; renderModalControls(); };
});

document.getElementById('decSeason').onclick = () => { formSeason = Math.max(1, formSeason - 1); renderModalControls(); };
document.getElementById('incSeason').onclick = () => { formSeason++; renderModalControls(); };
document.getElementById('decEp').onclick = () => { formEpisode = Math.max(1, formEpisode - 1); renderModalControls(); };
document.getElementById('incEp').onclick = () => { formEpisode++; renderModalControls(); };

document.getElementById('localSearch').oninput = function(e) {
  localQuery = e.target.value;
  document.getElementById('clearLocalSearch').style.display = localQuery ? 'block' : 'none';
  render();
};
document.getElementById('clearLocalSearch').onclick = function() {
  localQuery = '';
  document.getElementById('localSearch').value = '';
  document.getElementById('clearLocalSearch').style.display = 'none';
  render();
};
document.getElementById('sortSel').onchange = function(e) { sortBy = e.target.value; render(); };

document.getElementById('btnSettings').onclick = function() {
  document.getElementById('kpKeyInput').value = kpApiKey;
  document.getElementById('settingsModal').classList.add('open');
};
document.getElementById('closeSettingsModal').onclick = () => document.getElementById('settingsModal').classList.remove('open');
document.getElementById('saveKpKeyBtn').onclick = function() {
  kpApiKey = document.getElementById('kpKeyInput').value.trim();
  cloudSet(KP_KEY_STORAGE, kpApiKey);
  updateKpIndicator();
  document.getElementById('settingsModal').classList.remove('open');
  showToast(kpApiKey ? 'Ключ Кинопоиска сохранён' : 'Ключ очищен');
};
document.getElementById('clearKpKeyBtn').onclick = function() {
  kpApiKey = '';
  document.getElementById('kpKeyInput').value = '';
  cloudSet(KP_KEY_STORAGE, '');
  updateKpIndicator();
  showToast('Ключ удалён');
};

document.getElementById('btnExport').onclick = function() {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kinobrouski_backup.json';
  a.click();
};
document.getElementById('btnImport').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data)) {
        items = data;
        saveItems();
        render();
        showToast('Импортировано: ' + items.length);
      }
    } catch (err) {
      showToast('Ошибка файла');
    }
  };
  reader.readAsText(file);
};
